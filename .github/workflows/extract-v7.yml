name: Extract V7 project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract V7 ZIP
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP_FILE"
          rm -rf _v7
          mkdir _v7
          unzip -q "$ZIP_FILE" -d _v7
          cp -a _v7/. .
          rm -rf _v7 "$ZIP_FILE"

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract V7 project files"
          git push
